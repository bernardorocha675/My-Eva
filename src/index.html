<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Eva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="eva" class="inicio">

    <!-- Mascote: Eva (desenho original em SVG, cada parte animável) -->
    <div class="mascote" id="mascote" data-humor="neutra">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <clipPath id="olho-e"><path d="M33 67 Q45 56 58 65 Q46 75 33 67 Z"/></clipPath>
          <clipPath id="olho-d"><path d="M62 65 Q75 56 87 67 Q74 75 62 65 Z"/></clipPath>
          <clipPath id="lentes">
            <ellipse cx="46" cy="68.5" rx="13.5" ry="9.5"/>
            <ellipse cx="74" cy="68.5" rx="13.5" ry="9.5"/>
          </clipPath>
        </defs>

        <!-- cabelo de trás -->
        <path class="cabelo-escuro" d="M16 52 Q15 10 60 8 Q105 10 104 52 L107 120 L13 120 Z"/>
        <!-- pescoço atrás do rosto (a sombra acompanha o queixo) + ombros com roupinha -->
        <path class="pele" d="M53.5 84 L66.5 84 L67 106 L53 106 Z"/>
        <path class="sombra-pescoco" d="M53.5 84 L66.5 84 L66.5 99 Q60 101.5 53.5 99 Z"/>
        <path class="roupa" d="M22 120 Q25 106 44 102.5 L53 101 Q60 108 67 101 L76 102.5 Q95 106 98 120 Z"/>
        <path class="gola" d="M53 101 L60 110 L67 101"/>
        <path class="laco" d="M60 109 l-4 -2.4 v4.8 Z M60 109 l4 -2.4 v4.8 Z"/>
        <!-- rosto: queixo fino suave -->
        <path class="pele" d="M28 46 Q28 28 60 26 Q92 28 92 46 L91.5 63 C91 76 80 87 67 92.5 Q60 95.5 53 92.5 C40 87 29 76 28.5 63 Z"/>
        <!-- bochechas e pinta -->
        <ellipse class="blush" cx="38" cy="80" rx="6" ry="2.3"/>
        <ellipse class="blush" cx="82" cy="80" rx="6" ry="2.3"/>
        <circle class="pinta" cx="84" cy="76.5" r="0.9"/>

        <!-- olho esquerdo -->
        <g clip-path="url(#olho-e)">
          <rect class="esclera" x="30" y="50" width="32" height="28"/>
          <g class="iris-g">
            <circle class="iris" cx="46" cy="66.5" r="6"/>
            <circle class="pupila" cx="46" cy="66.5" r="2.6"/>
            <circle class="reflexo" cx="43.8" cy="64.2" r="1.4"/>
            <circle class="reflexo" cx="48.4" cy="68.6" r="0.6"/>
          </g>
          <g class="palpebra">
            <rect class="pele" x="28" y="40" width="36" height="23"/>
            <path class="delineado" d="M28 63 L64 63"/>
          </g>
        </g>
        <!-- olho direito -->
        <g clip-path="url(#olho-d)">
          <rect class="esclera" x="58" y="50" width="32" height="28"/>
          <g class="iris-g">
            <circle class="iris" cx="74" cy="66.5" r="6"/>
            <circle class="pupila" cx="74" cy="66.5" r="2.6"/>
            <circle class="reflexo" cx="71.8" cy="64.2" r="1.4"/>
            <circle class="reflexo" cx="76.4" cy="68.6" r="0.6"/>
          </g>
          <g class="palpebra palpebra-d">
            <rect class="pele" x="56" y="40" width="36" height="23"/>
            <path class="delineado" d="M56 63 L92 63"/>
          </g>
        </g>
        <!-- contorno de baixo, cílios e "asinha" do delineado -->
        <path class="contorno" d="M33 67 Q46 75 58 65"/>
        <path class="contorno" d="M62 65 Q74 75 87 67"/>
        <path class="cilios" d="M39 71.5 l-0.9 2.2 M45 73 l-0.3 2.2 M51 72 l0.4 2.2 M69 72 l-0.4 2.2 M75 73 l0.3 2.2 M81 71.5 l0.9 2.2"/>
        <path class="asa" d="M34.5 65.5 L28 61.5 M85.5 65.5 L92 61.5"/>

        <!-- nariz e boca -->
        <ellipse class="nariz" cx="60" cy="78.5" rx="1.5" ry="1"/>
        <path class="boca boca-neutra" d="M56 86.2 Q60 85.6 64 86.4"/>
        <path class="boca boca-deboche" d="M55.5 86.6 Q61 87.2 65.5 83.4"/>
        <path class="boca boca-seria" d="M56 86.3 L64 86.3"/>
        <path class="boca boca-curtindo" d="M55.5 85.4 Q60 89 64.5 85.4"/>
        <path class="olhos-curtindo" d="M36 68 Q46 61.5 56 66.5 M64 66.5 Q74 61.5 84 68"/>
        <path class="olho-pisca" d="M64 66.5 Q74 61.5 84 68"/>
        <!-- franja reta com mechas pontudas -->
        <path class="cabelo" d="M22 50 Q19 12 60 10 Q101 12 98 50 L95 58 L92 53 L87 61 L83 53.5 L77 59.5 L72 52.5 L66 61.5 L61 53 L54 60.5 L49 52.5 L43 59.5 L38 53.5 L33 61 L29 53 L25 57 Z"/>
        <path class="mecha" d="M36 20 L35 50 M50 15 L49 46 M64 15 L65 50 M80 19 L82 48"/>
        <!-- mechas laterais -->
        <path class="cabelo" d="M27 46 Q20 74 25 110 L33 108 Q29 78 32 52 Z"/>
        <path class="cabelo" d="M93 46 Q100 74 95 110 L87 108 Q91 78 88 52 Z"/>
        <!-- presilha vermelha -->
        <g class="presilha">
          <rect x="78" y="22" width="11" height="2.6" rx="1.3" transform="rotate(-28 83 23)"/>
          <rect x="80" y="27" width="11" height="2.6" rx="1.3" transform="rotate(-28 85 28)"/>
        </g>

        <!-- óculos finos, um pouco tortos e caídos no nariz -->
        <g class="oculos" transform="rotate(-3 60 69)">
          <ellipse class="lente" cx="46" cy="68.5" rx="13.5" ry="9.5"/>
          <ellipse class="lente" cx="74" cy="68.5" rx="13.5" ry="9.5"/>
          <path class="armacao" d="M59.3 67.5 Q60 66.2 60.7 67.5 M32.6 67 L26 64 M87.4 67 L94 64"/>
          <g clip-path="url(#lentes)">
            <g class="brilho"><rect x="30" y="52" width="5" height="36" transform="rotate(28 32 70)"/></g>
          </g>
        </g>
      </svg>
    </div>

    <!-- Nome "EVA" em pixel art, que surge na entrada (as letras são montadas pelo main.js) -->
    <div class="eva-nome" aria-label="Eva">
      <div class="eva-nome-letras" id="eva-nome-letras"></div>
      <span class="brilho-nome" aria-hidden="true"></span>
    </div>

    <!-- Painel com seções que deslizam pros lados -->
    <button class="seta esq" id="anterior" aria-label="Seção anterior">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="palco">
      <div class="trilho" id="trilho">

        <section class="secao geral" id="sec-geral">
          <div class="ge-hora">
            <span class="ge-relogio" id="ge-relogio">--:--</span>
            <div class="ge-data">
              <span id="ge-dia"></span>
              <span id="ge-data"></span>
            </div>
          </div>
          <div class="ge-chips">
            <button class="ge-chip" id="ge-controle" data-ir="sec-controle" aria-label="Ver controle">
              <svg viewBox="0 0 24 24"><path class="cheio" d="M7.5 7h9a5 5 0 0 1 4.9 4l.9 4.6a2.6 2.6 0 0 1-4.5 2.2L15.6 16H8.4l-2.2 1.8a2.6 2.6 0 0 1-4.5-2.2L2.6 11A5 5 0 0 1 7.5 7Z"/></svg>
              <span>Sem controle</span>
            </button>
            <button class="ge-chip" id="ge-musica" data-ir="sec-musica" aria-label="Ver música">
              <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
              <span>Sem música</span>
            </button>
            <button class="ge-chip" id="ge-claude" data-ir="sec-claude" aria-label="Ver Claude">
              <svg viewBox="0 0 24 24"><path d="M4 7l5 5-5 5M12 17h8"/></svg>
              <span>Tudo certo</span>
            </button>
          </div>
        </section>

        <section class="secao controle desligado" id="sec-controle">
          <div class="sec-topo">
            <svg viewBox="0 0 24 24"><path d="M7.5 7h9a5 5 0 0 1 4.9 4l.9 4.6a2.6 2.6 0 0 1-4.5 2.2L15.6 16H8.4l-2.2 1.8a2.6 2.6 0 0 1-4.5-2.2L2.6 11A5 5 0 0 1 7.5 7Z"/></svg>
            <span>Controle</span>
          </div>
          <div class="ctl-ligado">
            <div class="ctl-linha">
              <span class="ctl-titulo">DualShock 4</span>
              <span class="ctl-pct"><svg class="raio" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg><b id="pct">--%</b></span>
            </div>
            <div class="barra"><div class="barra-nivel"></div></div>
            <span class="ctl-sub" id="sub">Conectado</span>
          </div>
          <div class="ctl-off">Nenhum controle conectado</div>
        </section>

        <section class="secao musica vazia" id="sec-musica">
          <div class="mus-corpo">
            <div class="capa" id="mus-capa">
              <img id="mus-capa-img" alt="">
              <svg class="capa-nota" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
            </div>
            <div class="mus-info">
              <div class="mus-textos">
                <div class="letreiro" id="mus-letreiro"><span>Nada tocando</span></div>
                <span class="mus-sub" id="mus-artista">Abra o Spotify ou um vídeo</span>
              </div>
              <div class="mus-controles">
                <button class="mus-btn" id="mus-anterior" aria-label="Música anterior">
                  <svg viewBox="0 0 24 24"><path d="M7 5h2v14H7zM20 5v14L10 12z"/></svg>
                </button>
                <button class="mus-btn principal" id="mus-play" aria-label="Tocar">
                  <svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
                  <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="mus-btn" id="mus-proxima" aria-label="Próxima música">
                  <svg viewBox="0 0 24 24"><path d="M15 5h2v14h-2zM4 5v14l10-7z"/></svg>
                </button>
                <span class="mus-tempo" id="mus-tempo"></span>
              </div>
            </div>
          </div>
        </section>

        <section class="secao claude vazio" id="sec-claude">
          <div class="cl-topo">
            <span class="cl-rotulo">Claude</span>
            <span class="cl-selo" id="cl-selo">Tudo certo</span>
          </div>
          <div class="cl-linha">
            <div class="cl-icone" id="cl-icone">
              <svg viewBox="0 0 24 24"><path id="cl-icone-path" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </div>
            <div class="cl-textos">
              <span class="cl-titulo" id="cl-titulo">Nenhum aviso</span>
              <span class="cl-sub" id="cl-sub">Te chamo quando o Claude precisar de você</span>
            </div>
            <div class="cl-botoes" id="cl-botoes"></div>
          </div>
        </section>

      </div>
    </div>
    <button class="seta dir" id="proxima" aria-label="Próxima seção">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="pontos" id="pontos"></div>

    <!-- janela expandida do Claude: responder, aprovar, escolher opções -->
    <div class="cl-expandido" id="cl-expandido"></div>

    <!-- linha de tempo da música, na borda de baixo do painel -->
    <div class="mus-progresso" id="mus-progresso"><div></div></div>

    <div class="alca"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
